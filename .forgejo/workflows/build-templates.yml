on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 1 * *"

name: Build templates

jobs:
  build:
    name: Build Proxmox templates
    runs-on: podman-nix
    container:
      image: forge.macopla.com/homelab/packer/packer-ci:latest@sha256:16e39ffa150f0184d32b09bfd396f6a1ca8691ae3177df6aa38d15461282634c
      credentials:
        username: ci-bot
        password: ${{ secrets.CI_PACKER_PULL_TOKEN }}
    env:
      VAULT_ADDR: https://bao.macopla.com:8200
      BAO_ADDR: https://bao.macopla.com:8200
      GIT_SSH_COMMAND: ssh -i /root/.ssh/id_ed25519 -o UserKnownHostsFile=/root/.ssh/known_hosts
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure forge access
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CI_PACKER_ANSIBLE_DEPLOY_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 2222 forge.macopla.com >> ~/.ssh/known_hosts

      - name: Build
        env:
          ROLE_ID: ${{ secrets.CI_PACKER_ROLE_ID }}
          SECRET_ID: ${{ secrets.CI_PACKER_SECRET_ID }}
        run: |
          export VAULT_TOKEN="$(echo "$SECRET_ID" | bao write -field=token auth/approle/login role_id="$ROLE_ID" secret_id=-)"
          packer init .
          packer validate -var packer_ip=mouse.macopla.home .
          ansible-galaxy collection install -r requirements.yml
          packer build -force -var packer_ip=mouse.macopla.home .

      - name: Notify failure
        if: failure()
        run: |
          curl -fsS -X POST -H "Content-Type: application/json" \
            -d '{"title": "packer - ERREUR", "body": "Le build mensuel des templates a échoué, ils sont peut-être absents.", "tag": "infra-error"}' \
            https://apprise.macopla.com/notify/apprise
