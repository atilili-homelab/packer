on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - .forgejo/workflows/ci-image.yml

name: Build CI-Container

jobs:
  build-packer-ci:
    name: Build Packer CI Container
    runs-on: nix
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
    steps:
      - name: Install nodejs
        run: nix profile install nixpkgs#nodejs
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build image
        run: nix build '.#ci-image'
      - name: Push image
        run: |
          for tag in $FORGEJO_SHA latest; do
            nix develop -c skopeo --insecure-policy \
              copy --dest-creds "yoann:${{ secrets.CI_PACKER_PUSH_TOKEN }}" \
              docker-archive:result \
              docker://forge.macopla.com/homelab/packer/packer-ci:$tag
          done
