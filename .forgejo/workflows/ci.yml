on:
  push:
    branches-ignore: [main]

name: Test

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: docker
    container:
      image: forge.macopla.com/homelab/packer/packer-ci:latest@sha256:756cc7e6ddea20d99911a6f6cff0c3c5f167db164ad6136dc27ad3d421764619
      credentials:
        username: ci-bot
        password: ${{ secrets.CI_PACKER_PULL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        run: gitleaks git --redact --verbose --log-opts="origin/main..HEAD"
      - name: Cache pre-commit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
